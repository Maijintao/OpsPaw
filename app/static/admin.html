<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPaw · 管理</title><link rel="stylesheet" href="/static/acceptance.css"><link rel="stylesheet" href="/static/platforms.css"></head><body><main class="wrap"><header class="topbar"><div><h1>管理</h1><p>查看配置状态，运行已登记的本地作业。</p></div><a class="btn" href="/">返回对话</a></header><section class="panel"><h2>配置状态</h2><div id="settings" role="status" aria-live="polite"></div></section><section class="panel"><h2>数据保留</h2><p>默认不自动清理。保存策略后仍需显式启用；事故记录会保留。</p><form id="retention"><label><input id="retention-enabled" type="checkbox"> 启用后台清理</label><div class="fields"><label>普通诊断保留天数<input id="clear-days" type="number" min="1" required></label><label>裁剪诊断证据天数<input id="slim-days" type="number" min="1" required></label><label>告警流水保留天数<input id="intake-days" type="number" min="1" required></label></div><button class="btn">保存策略</button><p id="retention-status" role="status"></p></form></section><section class="panel"><div class="section-head"><h2>作业与检查</h2><button class="btn" id="refresh">刷新</button></div><p id="status" role="status" aria-live="polite"></p><div id="items"></div></section><nav class="panel"><a class="btn" href="/observability">成本观测</a><a class="btn" href="/alerts">告警接入</a><a class="btn" href="/incidents">事故中心</a></nav></main><script src="/static/admin.js"></script></body></html>
