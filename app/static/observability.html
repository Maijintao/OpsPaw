<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPaw · 成本观测</title><link rel="stylesheet" href="/static/acceptance.css"><link rel="stylesheet" href="/static/platforms.css"></head><body><main class="wrap"><header class="topbar"><div><h1>成本观测</h1><p>只展示当前生成的 Langfuse token 用量报告。</p></div><nav class="actions"><a class="btn" href="/admin">管理</a><a class="btn" href="/">返回对话</a></nav></header><section class="panel"><div class="section-head"><h2>按意图统计</h2><button class="btn" id="refresh">刷新</button></div><p id="status" role="status" aria-live="polite"></p><div id="report"></div></section></main><script>async function load(){const s=document.getElementById('status'),r=document.getElementById('report');s.textContent='正在读取…';try{const x=await fetch('/api/observability/overview').then(y=>y.json());r.replaceChildren();if(!x.report){s.textContent=x.status==='not_configured'?'尚未配置 Langfuse。':'尚未生成报告。';return;}const d=x.report;s.textContent='生成时间：'+(d.meta?.generated_at||'未记录');for(const row of d.rows||[]){const p=document.createElement('p');p.textContent=`${row.intent} · 请求 ${row.count} · 总 token ${row.tokens} · 单均 ${row.avg_tokens}`;r.append(p);}if(!(d.rows||[]).length)r.textContent='报告中没有当前意图数据。'}catch(e){s.textContent='读取失败：'+e.message}}document.getElementById('refresh').onclick=load;load();</script></body></html>
