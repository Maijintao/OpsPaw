<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPaw · 平台与监控</title><link rel="stylesheet" href="/static/acceptance.css"><link rel="stylesheet" href="/static/platforms.css"></head>
<body><main class="wrap"><header class="topbar"><div><h1>平台与监控</h1><p>接入观测数据，查看服务状态与指标。</p></div><a class="btn" href="/">返回对话</a></header>
<section class="panel"><div class="section-head"><h2>接入平台</h2><button class="btn" id="refresh">刷新状态</button></div><p id="platform-status" role="status" aria-live="polite"></p><div id="platform-list"></div>
<details id="editor"><summary>新增或编辑平台</summary><form id="platform-form"><input type="hidden" id="target-id"><div class="fields"><label>平台名称<input id="target-name" maxlength="128" required></label><label>所属集群<input id="target-cluster" maxlength="64"></label></div><p>数据源可配置 Prometheus、Jaeger、Loki 或 MCP；请求头用于上游鉴权。</p><div id="sources"></div><button class="btn" type="button" id="add-source">添加数据源</button><button class="btn" id="save">保存并检查连接</button><button class="btn" type="button" id="reset">清空表单</button><p id="form-status" role="status" aria-live="polite"></p></form></details></section>
<section class="panel"><h2>服务监控</h2><div class="fields"><label>平台<select id="monitor-target"><option value="">请选择平台</option></select></label><label>服务<select id="monitor-service"><option value="">全部服务</option></select></label><label>时间范围<select id="monitor-minutes"><option value="15">近 15 分钟</option><option value="60" selected>近 1 小时</option><option value="360">近 6 小时</option></select></label><button class="btn" id="load-monitor">刷新指标</button><button class="btn" id="load-dashboard">打开 Grafana 面板</button></div><p id="monitor-status" role="status" aria-live="polite">选择平台后查看指标。</p><div id="metric-cards"></div><iframe id="dashboard" title="Grafana 服务监控面板" hidden></iframe></section></main><script src="/static/platforms.js"></script></body></html>
