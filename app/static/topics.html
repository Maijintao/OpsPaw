<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPaw · 主题分类</title><link rel="stylesheet" href="/static/acceptance.css"><link rel="stylesheet" href="/static/platforms.css"></head><body><main class="wrap"><header class="topbar"><div><h1>主题分类</h1><p>查看权威主题类目，并用已部署模型试分文本。</p></div><nav class="actions"><a class="btn" href="/admin">管理</a><a class="btn" href="/">返回对话</a></nav></header><section class="panel"><h2>分类器状态</h2><p id="state" role="status" aria-live="polite">正在读取…</p><p>问题池分布、批量归类和离线评估数据依赖 RAG 问题池；当前未接入，不显示虚构统计。</p></section><section class="panel"><h2>试分类</h2><form id="form"><label>输入一条问题<textarea id="text" required rows="4" placeholder="例如：服务响应时间突然变慢"></textarea></label><button class="btn" id="run">分类</button></form><div id="result" aria-live="polite"></div></section><section class="panel"><h2>主题目录</h2><div id="topics"></div></section></main><script>
(async()=>{const $=id=>document.getElementById(id),el=(t,x,c)=>{const n=document.createElement(t);n.textContent=x;if(c)n.className=c;return n};let online=false;try{const d=await fetch('/api/topics').then(r=>r.json());online=d.classifier_online;$('state').textContent=online?'分类器在线；模型结果会显示在试分类区。':'分类器离线或模型尚未部署。';for(const x of d.topics){const a=el('article',undefined,'platform');a.append(el('h3',x.name+' · '+x.severity),el('p',x.boundary),el('p','示例：'+x.examples.join('、')));$('topics').append(a)}}catch(e){$('state').textContent='读取失败：'+e.message}$('form').onsubmit=async e=>{e.preventDefault();$('run').disabled=true;$('result').textContent='正在分类…';try{const r=await fetch('/api/topics/classify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texts:[$('text').value]})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'分类失败');$('result').replaceChildren(el('p',(d.results?.[0]?.labels||[]).join('、')||'没有返回标签。'));}catch(err){$('result').textContent=err.message}finally{$('run').disabled=false}}})();</script></body></html>
