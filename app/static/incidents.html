<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPaw · 事故中心</title><link rel="stylesheet" href="/static/acceptance.css"><link rel="stylesheet" href="/static/platforms.css"></head><body><main class="wrap"><header class="topbar"><div><h1>事故中心</h1><p>查看告警、诊断和修复汇集成的事故记录。</p></div><nav class="actions"><a class="btn" href="/alerts">告警与巡检</a><a class="btn" href="/">返回对话</a></nav></header><section class="panel"><div class="section-head"><h2>事故记录</h2><div class="actions"><select id="status"><option value="">全部状态</option><option value="open">处理中</option><option value="diagnosed">已定位</option><option value="mitigating">修复中</option><option value="resolved">已解决</option><option value="closed">已关闭</option><option value="merged">已合并</option></select><button class="btn" id="refresh">刷新</button></div></div><p id="message" role="status" aria-live="polite"></p><div id="items"></div></section></main><script>
(()=>{const $=id=>document.getElementById(id),el=(t,x,c)=>{const n=document.createElement(t);if(x!==undefined)n.textContent=x;if(c)n.className=c;return n};async function load(){ $('message').textContent='正在读取事故记录…';try{const q=$('status').value, data=await fetch('/api/incidents'+(q?'?status='+encodeURIComponent(q):'')).then(r=>r.json());$('items').replaceChildren();for(const x of data.incidents||[]){const card=el('article',undefined,'platform'),head=el('div',undefined,'section-head'),title=el('h3',x.title),badge=el('span',x.severity+' · '+x.status);head.append(title,badge);card.append(head,el('p',[x.platform,x.service,x.root_cause_service&&'根因 '+x.root_cause_service].filter(Boolean).join(' · ')),el('p','关联告警 '+x.alert_count+' 条 · 更新 '+(x.updated_at||'')));const a=el('a','查看时间线','btn');a.href='/incident/'+x.id;card.append(a);$('items').append(card)}if(!(data.incidents||[]).length)$('items').append(el('p','当前没有事故记录。','empty'));$('message').textContent=`共 ${data.stats?.incidents_total||0} 起事故，${data.stats?.alerts_total||0} 条告警。`}catch(e){$('message').textContent='读取失败：'+e.message}}$('refresh').onclick=load;$('status').onchange=load;load()})();
</script></body></html>
