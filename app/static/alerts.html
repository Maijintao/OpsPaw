<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPaw · 告警与巡检</title><link rel="stylesheet" href="/static/acceptance.css"><link rel="stylesheet" href="/static/platforms.css"></head>
<body><main class="wrap"><header class="topbar"><div><h1>告警与巡检</h1><p>配置外部告警、定时检查和指标规则，查看每次触发记录。</p></div><nav class="actions"><a class="btn" href="/platforms">平台与监控</a><a class="btn" href="/incidents">事故中心</a><a class="btn" href="/">返回对话</a></nav></header>
<section class="panel"><div class="section-head"><h2>接入规则</h2><button class="btn" id="refresh">刷新</button></div><p id="status" role="status" aria-live="polite"></p><div id="items"></div></section>
<section class="panel"><h2>新增告警接入</h2><form id="form"><div class="fields"><label>名称<input id="name" required maxlength="128" placeholder="例如：支付服务告警"></label><label>平台<select id="target"><option value="">使用已启用平台</option></select></label><label>服务名<input id="service" placeholder="留空时由诊断扫描"></label></div>
<fieldset><legend>触发方式（可多选）</legend><label><input type="checkbox" id="webhook" checked> 外部 webhook</label><label><input type="checkbox" id="schedule"> 定时巡检</label><label>间隔分钟<input type="number" id="interval" min="1" step="1" placeholder="填写巡检间隔"></label><label><input type="checkbox" id="threshold"> 指标阈值</label><div class="fields"><label>指标<select id="metric"><option value="error">错误率</option><option value="latency">P95时延</option><option value="calls">调用量</option><option value="cpu">CPU</option><option value="memory">内存</option></select></label><label>比较<select id="op"><option value=">">高于</option><option value="<">低于</option></select></label><label>阈值<input type="number" id="value" step="any" placeholder="按所选指标填写"></label></div></fieldset>
<div class="fields"><label>触发后处理<select id="action"><option value="diagnose">只发起诊断</option><option value="forward">诊断并转发</option><option value="repair">诊断后尝试修复</option></select></label><label>转发地址<input id="forward-url" type="url" placeholder="仅转发时填写"></label></div><button class="btn" id="save">创建接入</button></form></section></main><script src="/static/alerts.js"></script></body></html>
