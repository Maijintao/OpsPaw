[project]
name = "opspaw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "aiosqlite>=0.20",
    "asyncmy>=0.2.9",
    "drain3>=0.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.3.13",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langfuse>=4.14.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "matplotlib>=3.8",
    "mcp>=1.28.1",
    "numpy>=1.26",
    "openai>=2.45.0",
    "pandas>=2.2",
    "peft>=0.13",
    "pydantic-settings>=2.14.2",
    "python-box>=7.0",
    "pytz>=2024.1",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "sqlalchemy[asyncio]>=2.0.0",
    "torch>=2.6",
    "tqdm>=4.66",
    "transformers>=4.46",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
